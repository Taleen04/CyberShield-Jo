<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">

    <h2>Reset Your Password</h2>

    <input type="password" id="password" placeholder="New Password"><br><br>
    <input type="password" id="confirm" placeholder="Confirm Password"><br><br>

    <button onclick="resetPassword()">Reset Password</button>

    <p id="message"></p>

    <script>
        const token = "{{ token }}";

        async function resetPassword() {
            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirm").value;
            const message = document.getElementById("message");

            // ✅ check match
            if (password !== confirm) {
                message.innerText = "Passwords do not match";
                message.style.color = "red";
                return;
            }

            try {
                const res = await fetch("/auth/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token: token,
                        new_password: password
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    message.innerText = "✅ Password reset successful";
                    message.style.color = "green";
                } else {
                    message.innerText = data.detail || "Error occurred";
                    message.style.color = "red";
                }

            } catch (err) {
                message.innerText = "Network error";
                message.style.color = "red";
            }
        }
    </script>

</body>
</html>
